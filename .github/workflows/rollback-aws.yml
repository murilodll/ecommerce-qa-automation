name: Rollback - AWS

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: Commit SHA da imagem para rollback
        required: true
        type: string

      confirm:
        description: Confirmar rollback
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  rollback:
    name: Rollback AWS EC2
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Rollback with AWS Systems Manager
        shell: bash
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          REPORTS_BASE_URL: ${{ vars.REPORTS_BASE_URL }}
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}
        run: |
          ROLLBACK_SCRIPT=$(cat <<EOF
          set -eu

          cd /home/ubuntu/ecommerce-qa-automation

          export QA_IMAGE="${REGISTRY}/${IMAGE_NAME}:${IMAGE_SHA}"
          export REPORTS_BASE_URL="${REPORTS_BASE_URL}"

          echo "Rollback target:"
          echo "\$QA_IMAGE"

          echo "Downloading rollback image..."
          docker pull "\$QA_IMAGE"

          echo "Applying rollback..."
          docker compose -f config/docker/compose.yaml up \
            -d \
            --no-build

          CONTAINER_ID=\$(docker compose \
            -f config/docker/compose.yaml \
            ps -q qa)

          if [ -z "\$CONTAINER_ID" ]; then
            echo "Container qa was not created."
            exit 1
          fi

          echo "Waiting for healthcheck..."

          for ATTEMPT in \$(seq 1 12); do
            STATUS=\$(docker inspect \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              "\$CONTAINER_ID")

            echo "Health status: \$STATUS"

            if [ "\$STATUS" = "healthy" ]; then
              echo "Rollback completed successfully."

              docker inspect \
                --format='Running image: {{.Config.Image}}' \
                "\$CONTAINER_ID"

              exit 0
            fi

            if [ "\$STATUS" = "unhealthy" ]; then
              echo "Rollback container became unhealthy."
              docker logs --tail 100 "\$CONTAINER_ID"
              exit 1
            fi

            sleep 5
          done

          echo "Rollback healthcheck timeout."
          docker logs --tail 100 "\$CONTAINER_ID"
          exit 1
          EOF
          )

          PARAMETERS=$(jq -n \
            --arg script "$ROLLBACK_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"; then

            echo "Rollback failed. SSM output:"

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
